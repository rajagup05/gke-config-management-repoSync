
# 1. A ConfigMap to hold your app's environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app-config
  # Note: No namespace specified! Config Sync automatically applies it to the correct namespace.
data:
  APP_ENV: "production"
  DB_HOST: "database.internal"

---

# 2. The Deployment that spins up your application containers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web-container
        image: nginx:1.25 # Using a standard web server as an example
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: web-app-config # Safely references the ConfigMap above

---

# 3. A Service to expose your application internally
apiVersion: v1
kind: Service
metadata:
  name: web-app-service
spec:
  selector:
    app: web-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
